<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spire OS — A-Z Operations System</title>
<style>
:root{--bg:#ffffff;--panel:#f7f8fa;--ink:#1f2430;--mut:#6b7280;--line:#e6e9ee;--teal:#0FB5AE;--teal-d:#0a8f89;--navy:#1C4F86;
--g:#16a34a;--y:#f59e0b;--r:#dc2626;--shadow:0 8px 30px rgba(20,30,50,.10);}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
#top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:.2px}
.brand .dot{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--teal),var(--navy))}
.brand small{font-weight:600;color:var(--mut);font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:none;background:none;color:var(--mut);font-weight:600;font-size:13px;padding:7px 12px;border-radius:9px;cursor:pointer}
.tab:hover{background:var(--panel);color:var(--ink)}
.tab.on{background:var(--ink);color:#fff}
.grow{flex:1}
.tool{display:flex;align-items:center;gap:8px}
input,select{font:inherit}
#search{border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;min-width:150px;background:var(--panel)}
.fbtn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer}
.fbtn:hover{border-color:var(--teal)}
.fbtn.on{background:var(--teal);color:#fff;border-color:var(--teal)}
select.fsel{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 9px;font-size:12.5px;color:var(--ink)}
/* counters */
#counts{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 13px;min-width:96px}
.kpi .n{font-size:20px;font-weight:800;line-height:1}
.kpi .l{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.kpi.g .n{color:var(--g)}.kpi.y .n{color:var(--y)}.kpi.r .n{color:var(--r)}
.bar{height:7px;border-radius:6px;background:#eceff3;overflow:hidden;margin-top:6px;min-width:120px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--navy))}
/* views */
#stage{position:relative}
.view{display:none;padding:16px}
.view.on{display:block}
/* mindmap */
#mm{display:none;position:relative;height:calc(100vh - 168px);overflow:hidden;background:
 radial-gradient(circle at 1px 1px,#e9edf2 1px,transparent 0) 0 0/26px 26px,#fbfcfd;cursor:grab}
#mm.on{display:block}
#mm.drag{cursor:grabbing}
#mmworld{position:absolute;left:0;top:0;transform-origin:0 0}
#mmedges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.node{position:absolute;width:186px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--mut);border-radius:13px;padding:11px 12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .08s,box-shadow .12s;user-select:none}
.node:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(20,30,50,.16)}
.node.sg{border-left-color:var(--g)}.node.sy{border-left-color:var(--y)}.node.sr{border-left-color:var(--r)}
.node .nt{font-weight:700;font-size:13px;line-height:1.25}
.node .nd{font-size:10.5px;color:var(--mut);margin-top:4px;display:flex;align-items:center;gap:6px}
.node .light{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.light.g{background:var(--g)}.light.y{background:var(--y)}.light.r{background:var(--r)}
.node.branch{background:#fbfaff;border-style:dashed}
.node.dim{opacity:.22;filter:grayscale(.4)}
.chip{display:inline-block;font-size:9.5px;font-weight:700;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1px 7px;margin-top:7px}
.mmhint{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--mut);background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.mmzoom{position:absolute;right:14px;bottom:12px;display:flex;gap:6px}
.mmzoom button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
/* department view */
.depgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.depcol{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.depcol h3{margin:0 0 4px;font-size:13.5px}
.depcol .cnt{font-size:11px;color:var(--mut);margin-bottom:8px}
.dnode{background:#fff;border:1px solid var(--line);border-radius:10px;border-left:4px solid var(--mut);padding:9px 11px;margin-bottom:7px;cursor:pointer}
.dnode.sg{border-left-color:var(--g)}.dnode.sy{border-left-color:var(--y)}.dnode.sr{border-left-color:var(--r)}
.dnode b{font-size:13px}.dnode span{font-size:11px;color:var(--mut);display:block;margin-top:2px}
/* SOP + KPI + RYG cards */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(20,30,50,.04)}
.card h3{margin:0 0 3px;font-size:15px}
.card .sub{font-size:12px;color:var(--mut);margin-bottom:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr{cursor:pointer}.tbl tr:hover td{background:var(--panel)}
.pill{font-size:10px;font-weight:700;border-radius:20px;padding:2px 9px;text-transform:uppercase}
.pill.g{background:#e7f4e8;color:var(--g)}.pill.y{background:#fef3d6;color:#9a6a06}.pill.r{background:#fde8e8;color:var(--r)}
.ryg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rygcol h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:14px}
.rygcol .light{width:12px;height:12px;border-radius:50%}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.krow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px}
.krow b{font-size:11px;color:var(--navy)}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sw{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;text-decoration:none;color:var(--ink)}
.sw .sq{width:26px;height:26px;border-radius:7px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.sw b{font-size:13px}.sw span{font-size:10.5px;color:var(--mut);display:block}
/* detail panel */
#scrim{position:fixed;inset:0;background:rgba(15,20,30,.35);z-index:60;display:none}
#panel{position:fixed;top:0;right:0;height:100%;width:440px;max-width:94vw;background:#fff;box-shadow:-16px 0 50px rgba(0,0,0,.18);z-index:61;transform:translateX(100%);transition:transform .22s;overflow:auto}
#panel.open{transform:none}
.phd{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 18px;z-index:2}
.phd .x{position:absolute;right:14px;top:14px;border:none;background:var(--panel);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px}
.phd h2{margin:0 22px 0 0;font-size:18px}
.phd .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.pbody{padding:16px 18px}
.sec{margin-bottom:16px}
.sec h4{margin:0 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.sec p{margin:0;font-size:13.5px;line-height:1.5}
.ck{display:flex;align-items:flex-start;gap:9px;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ck input{margin-top:2px}
.tag{display:inline-block;font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 9px;margin:0 5px 5px 0}
.tag.tmpl{background:#eef6ff;border-color:#cfe4fb}
.tag.auto{background:#f0fdf4;border-color:#c9ead2}
.tag.kpi{background:#fff7e8;border-color:#f3e2bd}
.sof{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;margin:0 5px 5px 0}
.sof i{width:9px;height:9px;border-radius:3px;display:inline-block}
.editrow{display:flex;gap:6px;margin-top:6px}
.editrow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer}
.mini:hover{border-color:var(--teal)}
.statusset{display:flex;gap:6px}
.statusset button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
.statusset button.g.on{background:var(--g);color:#fff;border-color:var(--g)}
.statusset button.y.on{background:var(--y);color:#fff;border-color:var(--y)}
.statusset button.r.on{background:var(--r);color:#fff;border-color:var(--r)}
textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;font-size:13px;min-height:64px;resize:vertical}
a.link{color:var(--teal-d);font-weight:600;text-decoration:none}
.foot{text-align:center;color:var(--mut);font-size:11px;padding:14px}
@media print{#top,#counts,#scrim,.mmhint,.mmzoom{display:none!important}#panel{position:static;transform:none;width:100%;box-shadow:none}.view{display:block!important}}
</style></head>
<body>
<div id="top">
  <div class="brand"><span class="dot"></span><div>SPIRE OS<br><small>A-Z Operations System</small></div></div>
  <div class="tabs" id="tabs"></div>
  <div class="grow"></div>
  <div class="tool">
    <input id="search" placeholder="Search systems…" oninput="applyFilters()">
    <select class="fsel" id="fdept" onchange="applyFilters()"><option value="">All departments</option></select>
    <select class="fsel" id="fowner" onchange="applyFilters()"><option value="">All owners</option></select>
    <select class="fsel" id="fsoft" onchange="applyFilters()"><option value="">All software</option></select>
    <button class="fbtn" data-st="green" onclick="toggleStatusFilter('green',this)">🟢</button>
    <button class="fbtn" data-st="yellow" onclick="toggleStatusFilter('yellow',this)">🟡</button>
    <button class="fbtn" data-st="red" onclick="toggleStatusFilter('red',this)">🔴</button>
    <button class="fbtn" id="adminBtn" onclick="toggleAdmin()">✏️ Admin</button>
    <button class="fbtn" onclick="window.print()">⬇︎ PDF</button>
    <button class="fbtn" onclick="exportImage()">🖼 Image</button>
    <a class="fbtn" href="https://spireconstructors.com/scope" style="text-decoration:none">↗ Scope Tracker</a>
  </div>
</div>
<div id="counts"></div>
<div id="stage">
  <div id="mm" class="on">
    <svg id="mmedges"></svg>
    <div id="mmworld"></div>
    <div class="mmhint">Drag background to pan · scroll to zoom · drag a card to move · click to open</div>
    <div class="mmzoom"><button onclick="zoomBy(1.2)">+</button><button onclick="zoomBy(.83)">−</button><button onclick="fitView()" title="Reset" style="font-size:13px">⤢</button></div>
  </div>
  <div class="view" id="v_dept"></div>
  <div class="view" id="v_sop"></div>
  <div class="view" id="v_kpi"></div>
  <div class="view" id="v_ryg"></div>
  <div class="view" id="v_soft"></div>
  <div class="foot" id="foot"></div>
</div>
<div id="scrim" onclick="closePanel()"></div>
<div id="panel"></div>

  Object.keys(byd).forEach(d=>{const arr=byd[d];if(!arr.length)return;
    h+='<div class="depcol"><h3>'+esc(d)+'</h3><div class="cnt">'+arr.length+' system'+(arr.length>1?'s':'')+'</div>';
    arr.forEach(n=>h+='<div class="dnode s'+sc(n.status)+'" onclick="openNode(\''+n.id+'\')"><b>'+esc(n.title)+'</b><span>'+esc(n.owner)+'</span></div>');
    h+='</div>';});
  host.innerHTML=h+'</div>';
}
// ---------- SOP LIBRARY ----------
function renderSOP(){
  const shown=NODES.filter(nodeMatch);
  let h='<div class="card"><h3>SOP Library</h3><div class="sub">Every system, its owner, checklist depth and linked SOP. Click a row to open.</div>'+
    '<table class="tbl"><thead><tr><th>System</th><th>Department</th><th>Owner</th><th>Status</th><th>Checklist</th><th>Templates</th><th>SOP</th></tr></thead><tbody>';
  shown.forEach(n=>{h+='<tr onclick="openNode(\''+n.id+'\')"><td><b>'+esc(n.title)+'</b></td><td>'+esc(n.department)+'</td><td>'+esc(n.owner)+'</td>'+
    '<td><span class="pill '+sc(n.status)+'">'+n.status+'</span></td><td>'+(n.checklist||[]).length+' steps</td><td>'+(n.templates||[]).length+'</td><td>'+esc(n.sop_link||'')+'</td></tr>';});
  document.getElementById('v_sop').innerHTML=h+'</tbody></table></div>';
}
// ---------- KPI DASHBOARD ----------
function renderKPI(){
  const shown=NODES.filter(nodeMatch);let h='';
  h+='<div class="card"><h3>KPI Dashboard</h3><div class="sub">All operating KPIs across the system, by node.</div><div class="kgrid">';
  shown.forEach(n=>{(n.kpis||[]).forEach(k=>{h+='<div class="krow"><b>'+esc(n.title)+'</b><br>'+esc(k)+'</div>';});});
  h+='</div></div>';
  document.getElementById('v_kpi').innerHTML=h;
}
// ---------- RYG DASHBOARD ----------
function renderRYG(){
  const shown=NODES.filter(nodeMatch);const cols={red:[],yellow:[],green:[]};shown.forEach(n=>cols[n.status].push(n));
  const col=(st,lbl,cl)=>{let h='<div class="rygcol"><h3><span class="light '+cl+'"></span>'+lbl+' ('+cols[st].length+')</h3>';
    cols[st].forEach(n=>h+='<div class="dnode s'+cl+'" onclick="openNode(\''+n.id+'\')"><b>'+esc(n.title)+'</b><span>'+esc(n.department)+' · '+esc(n.owner)+'</span></div>');return h+'</div>';};
  document.getElementById('v_ryg').innerHTML='<div class="ryg">'+col('red','Red — needs a system','r')+col('yellow','Yellow — needs review','y')+col('green','Green — systemized','g')+'</div>';
}
// ---------- SOFTWARE STACK ----------
function renderSoft(){
  let h='<div class="card"><h3>Software Stack</h3><div class="sub">The tools Spire OS ties together. Live API wiring is added per tool (authorize in connector settings).</div><div class="swgrid">';
  DATA.software.forEach(s=>{const used=NODES.filter(n=>(n.software||[]).includes(s.id)).length;
    h+='<a class="sw" href="'+s.url+'" target="_blank"><span class="sq" style="background:'+s.color+'">'+esc(s.name[0])+'</span><div><b>'+esc(s.name)+'</b><span>'+esc(s.cat)+' · '+used+' systems</span></div></a>';});
  document.getElementById('v_soft').innerHTML=h+'</div></div>';
}

function render(){
  renderCounts();
  if(view==='mm')renderMM();
  else if(view==='dept')renderDept();
  else if(view==='sop')renderSOP();
  else if(view==='kpi')renderKPI();
  else if(view==='ryg')renderRYG();
  else if(view==='soft')renderSoft();
  document.getElementById('foot').textContent='Spire OS · '+NODES.length+' systems · single source of truth · v1';
}

// ---------- DETAIL PANEL ----------
let cur=null;
function openNode(id){cur=id;const n=BYID[id];const p=document.getElementById('panel');
  const softHTML=(n.software||[]).map(s=>{const o=SW[s];return o?'<span class="sof"><i style="background:'+o.color+'"></i>'+esc(o.name)+'</span>':''}).join('');
  const ck=(n.checklist||[]).map((c,i)=>{const done=n.checklistState[i];return '<label class="ck"><input type="checkbox" '+(done?'checked':'')+' onchange="toggleCk(\''+id+'\','+i+',this.checked)"><span>'+esc(c)+'</span></label>'}).join('');
  const rel=(n.related_nodes||[]).map(r=>BYID[r]?'<span class="tag" style="cursor:pointer" onclick="openNode(\''+r+'\')">'+esc(BYID[r].title)+'</span>':'').join('');
  p.innerHTML='<div class="phd"><button class="x" onclick="closePanel()">✕</button>'+
    '<h2>'+esc(n.title)+'</h2><div class="meta">'+
    '<span class="statusset">'+['green','yellow','red'].map(st=>'<button class="'+sc(st)+(n.status===st?' on':'')+'" onclick="setStatus(\''+id+'\',\''+st+'\')">'+({green:'Green',yellow:'Yellow',red:'Red'}[st])+'</button>').join('')+'</span>'+
    '<span class="tag">'+esc(n.department)+'</span><span class="tag">Owner: '+esc(n.owner)+'</span></div></div>'+
    '<div class="pbody">'+
    sec('Purpose','<p>'+esc(n.purpose)+'</p>')+
    sec('Software',softHTML||'<span class="sub">—</span>')+
    sec('Checklist ('+(n.checklist||[]).length+')',ck+(admin?'<div class="editrow"><input id="ckadd" placeholder="Add checklist step…"><button class="mini" onclick="addCk(\''+id+'\')">Add</button></div>':''))+
    sec('KPIs',(n.kpis||[]).map(k=>'<span class="tag kpi">'+esc(k)+'</span>').join('')||'—')+
    sec('Templates',(n.templates||[]).map(t=>'<span class="tag tmpl">'+esc(t)+'</span>').join('')+(admin?'<div class="editrow"><input id="tmpadd" placeholder="Add template…"><button class="mini" onclick="addArr(\''+id+'\',\'templates\',\'tmpadd\')">Add</button></div>':'')||'—')+
    sec('Automations',(n.automations||[]).map(a=>'<span class="tag auto">'+esc(a)+'</span>').join('')||'—')+
    sec('SOP Link',admin?'<div class="editrow"><input id="sopedit" value="'+esc(n.sop_link||'')+'"><button class="mini" onclick="setField(\''+id+'\',\'sop_link\',document.getElementById(\'sopedit\').value)">Save</button></div>':'<a class="link" href="#">'+esc(n.sop_link||'—')+'</a>')+
    ((n.common_mistakes&&n.common_mistakes.length)?sec('Common Mistakes',(n.common_mistakes).map(m=>'<div class="ck">⚠️ <span>'+esc(m)+'</span></div>').join('')):'')+
    ((n.improvement_ideas&&n.improvement_ideas.length)?sec('Improvement Ideas',(n.improvement_ideas).map(m=>'<div class="ck">💡 <span>'+esc(m)+'</span></div>').join('')):'')+
    (rel?sec('Related',rel):'')+
    sec('Notes',admin?'<textarea id="noteedit" onchange="setField(\''+id+'\',\'notes\',this.value)">'+esc(n.notes||'')+'</textarea>':('<p>'+(esc(n.notes)||'<span class="sub">—</span>')+'</p>'))+
    '</div>';
  document.getElementById('scrim').style.display='block';p.classList.add('open');
}
function sec(h,body){return '<div class="sec"><h4>'+h+'</h4>'+body+'</div>'}
function closePanel(){document.getElementById('panel').classList.remove('open');document.getElementById('scrim').style.display='none';cur=null}
function toggleCk(id,i,on){store.ck=store.ck||{};store.ck[id]=store.ck[id]||{};store.ck[id][i]=on;BYID[id].checklistState[i]=on;save()}
function setStatus(id,st){setField(id,'status',st);BYID[id].status=st;render();openNode(id)}
function setField(id,f,v){store.nodes=store.nodes||{};store.nodes[id]=store.nodes[id]||{};store.nodes[id][f]=v;BYID[id][f]=v;save();if(f!=='notes'&&f!=='sop_link'){render()}}
function addArr(id,arr,inputId){const v=document.getElementById(inputId).value.trim();if(!v)return;const a=(BYID[id][arr]||[]).slice();a.push(v);setField(id,arr,a);openNode(id)}
function addCk(id){const v=document.getElementById('ckadd').value.trim();if(!v)return;const a=(BYID[id].checklist||[]).slice();a.push(v);setField(id,'checklist',a);openNode(id)}
function toggleAdmin(){admin=!admin;document.getElementById('adminBtn').classList.toggle('on',admin);if(cur)openNode(cur)}

// ---------- export image ----------
function exportImage(){
  const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  s.onload=()=>{const tgt=view==='mm'?document.getElementById('mm'):document.querySelector('.view.on')||document.getElementById('mm');
    html2canvas(tgt,{backgroundColor:'#fff',scale:2}).then(cv=>{const a=document.createElement('a');a.download='spire-os-'+view+'.png';a.href=cv.toDataURL('image/png');a.click();});};
  s.onerror=()=>{alert('Image export needs internet for the render library — using Print → Save as PDF instead.');window.print();};
  document.body.appendChild(s);
}
// keyboard
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
window.addEventListener('resize',()=>{if(view==='mm')drawEdges()});
render();
</script></body></html>
